# Debug build: west build -b ch32v003evt -- -DEXTRA_CONF_FILE=debug.conf
#
# -Og keeps enough structure that GDB can reliably show local variables
# (prj.conf uses -Os for the release build, which is small but tends to
# optimize locals away — "value optimized out" in gdb).
#
# This alone uses ~90% of the 16K ROM, so it is NOT combined with
# serial.conf by default: DEBUG_OPTIMIZATIONS + printk/UART together
# overflow ROM by ~2.8K on this chip. Use debug.conf when you need to
# single-step and inspect variables; use serial.conf when you need
# printk output instead. Combine only after trimming app code to make
# room for both.
CONFIG_DEBUG_OPTIMIZATIONS=y
