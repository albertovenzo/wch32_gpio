CONFIG_SIZE_OPTIMIZATIONS=y

CONFIG_GPIO=y
CONFIG_PWM=y

# Not used by this application: board defconfig enables these, so they
# must be turned off explicitly to keep them out of the tight 16K ROM.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n

