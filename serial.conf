# Optional UART console: west build -b ch32v003evt -- -DEXTRA_CONF_FILE=serial.conf
#
# Re-enables USART1 (already pinctrl'd as zephyr,console in the board's
# .dts) so printk() reaches the serial terminal at 115200 8N1. Keeps
# -Os (prj.conf) rather than -Og so it still fits in the 16K ROM;
# see debug.conf for why the two aren't combined by default.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_CBPRINTF_NANO=y
