description: Custom TTL PWM output node

compatible: "wch,ttl-pwm"

include: base.yaml

properties:
  pwms:
    type: phandle-array
    required: true
    description: |
      PWM channel to use. Format should be <&pwm_node channel period_in_hz flags>.

  pwm-names:
    type: string-array
    description: |
      Name of the PWM channel. Useful if a device has multiple PWMs.
